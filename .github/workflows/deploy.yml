# Publishes the site to GitHub Pages every time something is merged into main.
#
# ONE-TIME SETUP (do this before the first merge to main):
#   GitHub repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions
#
# The site will then be live at https://avemath.github.io/BcofADAM/
# After you connect a custom domain (Settings → Pages → Custom domain), the
# workflow picks it up automatically — no code changes needed.
name: Deploy site

on:
  push:
    branches: [main]
  # Rebuild every Monday so events move from "Coming up" to "What we've done" on their own.
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
