# Once a month, checks every link on the site (including every statistic's
# source) and fails if any are broken. Also runs on demand from the Actions tab.
# If it fails, open the run, look at the summary, and fix or replace the link
# (usually in src/data/facts.ts or src/data/resources.ts).
name: Check links

on:
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          # These sites block automated checkers (they answer 403 Forbidden to GitHub's servers even
          # though the pages work fine in a browser), so they're skipped: Facebook, the CDC, the CPSC,
          # Pool Safely and the AAP journal.
          # REMINDER: since these aren't checked automatically, click through the CDC, CPSC, Pool Safely
          # and AAP links on /the-facts and /resources by hand a couple of times a year.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --exclude "facebook\.com"
            --exclude "cdc\.gov"
            --exclude "cpsc\.gov"
            --exclude "poolsafely\.gov"
            --exclude "publications\.aap\.org"
            --exclude "localhost"
            --max-retries 3
            --accept 200,206,429
            "dist/**/*.html"
          fail: true
