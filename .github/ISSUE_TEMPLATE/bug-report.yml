name: Something looks broken
description: A page that looks wrong, a broken link, or something that doesn't work.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page address
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A screenshot helps a lot. Drag it into this box.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Computer
