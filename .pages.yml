# The Studio: our website editor (Pages CMS, https://app.pagescms.org)
# This file tells the Studio what can be edited and how each box is labeled.
# Every save goes straight to the website. It's live in about 2 minutes.

media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Add {filename} ({userName})"
      update: "Update {filename} ({userName})"
      delete: "Remove {filename} ({userName})"
      rename: "Rename {oldFilename} to {newFilename} ({userName})"

content:
  # ───────────────────────────── Settings ─────────────────────────────
  - name: settings
    label: ⚙️ Site settings (donate link, Facebook, email)
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: donateUrl
        label: Donation link
        type: string
        description: Paste the full link to your donation page (Zeffy, Givebutter, etc.). The Donate buttons appear on the site as soon as this has a link. Leave it empty to hide every Donate button.
      - name: showFacebookFeed
        label: Show our Facebook feed on the website
        type: boolean
      - name: facebookUrl
        label: Facebook page link
        type: string
      - name: email
        label: Contact email
        type: string
      - name: contactFormAction
        label: Contact form link (optional)
        type: string
        description: From Web3Forms or Formspree. Leave empty to show the email address instead.
      - name: contactFormKey
        label: Web3Forms access key (only if the contact form uses Web3Forms)
        type: string
      - name: newsletterFormAction
        label: Newsletter form address (optional)
        type: string
        description: 'The form "action" address from Mailchimp, Buttondown, MailerLite, etc. The email sign-up shows in the footer as soon as this is filled in.'
      - name: newsletterEmailField
        label: Newsletter email field name
        type: string
        description: 'Usually "email". Mailchimp uses "EMAIL".'
      - name: newsletterUrl
        label: Newsletter sign-up page link (optional, used if there's no form address)
        type: string
      - name: instagramUrl
        label: Instagram link
        type: string
      - name: tiktokUrl
        label: TikTok link
        type: string
      - name: youtubeUrl
        label: YouTube link
        type: string
      - name: linkedinUrl
        label: LinkedIn link
        type: string
      - name: location
        label: Where we're based
        type: string
        description: 'Shown in the footer and used across the site (currently "Blair County, Pennsylvania").'
      - name: taxExempt
        label: We're an IRS-approved 501(c)(3)
        type: boolean
        description: 'Shows "Because of ADAM is a 501(c)(3) nonprofit organization. EIN ..." in the footer and on the About and Donate pages.'
      - name: ein
        label: EIN (tax ID number)
        type: string
        description: 'Replace {{TODO: EIN}} with our EIN, like 12-3456789. The site can''t launch until this is filled in.'
      - name: themeColor
        label: Browser color (theme color)
        type: string
        description: 'The color phones use for the browser bar, as a hex code like #083349. If the logo colors change, update this to match.'
      - name: analyticsProvider
        label: Analytics
        type: select
        options:
          values: [none, plausible, fathom, cloudflare]
        description: Privacy-friendly visitor counts with no cookies. Pick the service you signed up for, or none.
      - name: analyticsSite
        label: Analytics site ID
        type: string
        description: 'Plausible: your domain (becauseofadam.org). Fathom: the site ID. Cloudflare: the token from the snippet.'
      - name: launchReady
        label: Launch the site (removes the "Preview" banner and lets Google find us)
        type: boolean
        description: 'The site won''t publish with this on while any {{TODO}} or "Family, please review" box is left. If a save doesn''t show up, check the Actions tab on GitHub for the list.'
      - name: name
        label: Organization name
        type: string
      - name: tagline
        label: Full name (what ADAM stands for)
        type: string
        description: 'Allies in the Drowning Awareness Movement. Used in page titles, the footer, the About page and search results.'
      - name: description
        label: Short description (used by Google and link previews)
        type: text

  # ───────────────────────────── Home page ─────────────────────────────
  - name: home
    label: 🏠 Home page
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: heroLede
        label: Intro under "Drowning is silent. We won't be."
        type: text
      - name: meetTitle
        label: "\"Meet Adam\" heading"
        type: string
      - name: teaser
        label: "\"Meet Adam\" paragraph"
        type: text
        description: Type {{Adam's age}} and the site fills in his age.
      - name: teaserMore
        label: Second paragraph
        type: text
      - name: photo
        label: Photo of Adam
        type: image
      - name: photoAlt
        label: Describe the photo (for people who can't see it)
        type: string
      - name: storyPhoto
        label: Photo beside the opening of Adam's Story (leave empty to reuse the one above)
        type: image
      - name: storyPhotoAlt
        label: Describe that photo (for people who can't see it)
        type: string
      - name: storyPhotoCaption
        label: Caption under that photo
        type: string
      - name: timeCompare
        label: Line under the clock
        type: string
      - name: familyQuote
        label: Big quote
        type: string
      - name: familyQuoteBy
        label: Who said it
        type: string
      - name: hopeTurn
        label: Hopeful line after the quote
        type: string
      - name: tonightTitle
        label: "\"Things to do tonight\" heading"
        type: string
      - name: tonightIntro
        label: Line under that heading
        type: text
      - name: tonight
        label: Things to do tonight (keep them quick)
        type: string
        list: true

  # ───────────────────────────── Pages ─────────────────────────────
  - name: anywhere
    label: "🌙 Home page: Anywhere, anytime"
    type: file
    path: src/data/anywhere.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        type: string
      - name: title
        label: Heading
        type: string
      - name: rotatePrefix
        label: Start of the moving line
        type: string
        description: For example "It can happen in"
      - name: rotateWords
        label: Words that flip by
        type: string
        list: true
        description: They flip by one at a time when someone scrolls to this part of the page. The last one stays on screen.
      - name: lede
        label: Intro
        type: text
      - name: places
        label: Places & times
        type: object
        list: true
        fields:
          - name: icon
            label: Icon (one emoji)
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: What to know
            type: text
          - name: tip
            label: What helps
            type: text
          - name: source
            label: Source (needed for any number)
            type: string
          - name: sourceUrl
            label: Source link
            type: string
          - name: source2
            label: Second source (optional)
            type: string
          - name: sourceUrl2
            label: Second source link
            type: string
          - name: link
            label: Link to another page (optional)
            type: string
            description: For example /swim-lessons
          - name: linkLabel
            label: Link text
            type: string
      - name: quote
        label: Quote at the bottom
        type: text
      - name: quoteBy
        label: Who said it
        type: string

  - name: pages
    label: 📄 Pages
    type: group
    items:
      - name: adams-story
        label: Adam's Story
        type: file
        path: src/content/pages/adams-story.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
          - name: eyebrow
            label: Small label above the title
            type: string
          - name: lede
            label: Intro under the title
            type: text
          - name: description
            label: Short description for Google (under 155 characters)
            type: text
          - name: image
            label: Share picture (optional)
            type: image
            description: Shows when this page is shared on Facebook or in a text. Leave empty to use the site's share card.
          - name: imageAlt
            label: Describe the share picture
            type: string
          - name: body
            label: Page text
            type: rich-text
            description: Type {{Adam's age}} anywhere on this page and the site fills in his age, so it never goes out of date.
            options:
              format: markdown
      - name: swim-lessons
        label: ISR Swim Lessons
        type: file
        path: src/content/pages/swim-lessons.md
        format: yaml-frontmatter
        fields: &pageFields
          - name: title
            label: Page title
            type: string
          - name: eyebrow
            label: Small label above the title
            type: string
          - name: lede
            label: Intro under the title
            type: text
          - name: description
            label: Short description for Google (under 155 characters)
            type: text
          - name: image
            label: Share picture (optional)
            type: image
            description: Shows when this page is shared on Facebook or in a text. Leave empty to use the site's share card.
          - name: imageAlt
            label: Describe the share picture
            type: string
          - name: body
            label: Page text
            type: rich-text
            options:
              format: markdown
      - name: isr-program
        label: "ISR Swim Lessons: Dad's story box"
        type: file
        path: src/data/isr.json
        format: json
        fields:
          - name: programName
            label: Box heading (keep it about ISR, not the business name)
            type: string
          - name: blurb
            label: Short story
            type: text
          - name: stance
            label: Why we recommend ISR (home page, one or two sentences)
            type: text
          - name: disclosure
            label: Separation note (please keep this)
            type: text
            description: Keeps the nonprofit and Dad's swim lessons clearly separate. Please don't add sign-up links, prices or intake forms for Dad's lessons to the nonprofit site. Those belong on his own business page.
          - name: photo
            label: Photo
            type: image
          - name: photoAlt
            label: Describe the photo
            type: string
      - name: pediatricians
        label: "ISR Swim Lessons: What pediatricians say"
        type: file
        path: src/data/pediatricians.json
        format: json
        fields:
          - name: title
            label: Heading
            type: string
          - name: summary
            label: What the AAP recommends, in plain words
            type: text
            description: Shows next to our ISR content on the ISR page and the home page. Keep it matching the AAP's current advice.
          - name: points
            label: Key points
            type: string
            list: true
          - name: source
            label: Source name
            type: string
          - name: sourceUrl
            label: Source link
            type: string
          - name: policyUrl
            label: Link to the full AAP policy
            type: string
      - name: about-photo
        label: "About Us: family photo"
        type: file
        path: src/data/about.json
        format: json
        fields:
          - name: photo
            label: Photo (shows right under "It started with our little brother.")
            type: image
          - name: photoAlt
            label: Describe the photo (for people who can't see it)
            type: string
          - name: caption
            label: Caption under the photo
            type: string
      - name: survivors-photos
        label: "Survivors & Families: photos"
        type: file
        path: src/data/survivors.json
        format: json
        fields:
          - name: photo
            label: Photo at the top of the page
            type: image
          - name: photoAlt
            label: Describe the photo (for people who can't see it)
            type: string
          - name: caption
            label: Caption under the photo
            type: string
          - name: photo2
            label: Photo under "What nonfatal drowning means"
            type: image
          - name: photo2Alt
            label: Describe that photo
            type: string
          - name: caption2
            label: Caption under that photo
            type: string
          - name: lifePhotos
            label: Photos under "Life after a drowning" (the hospital ones)
            type: object
            list: true
            description: They sit side by side on a computer and stack on a phone. Two or three fit well.
            fields:
              - name: photo
                label: Photo
                type: image
              - name: alt
                label: Describe the photo (for people who can't see it)
                type: string
              - name: caption
                label: Caption
                type: string
          - name: momentsTitle
            label: "Life goes on: heading"
            type: string
          - name: momentsText
            label: "Life goes on: the paragraph"
            type: text
          - name: moments
            label: "Life goes on: photos"
            type: object
            list: true
            description: Seven photos fill the grid exactly, with the first one wide. Any photo works, but this fits best.
            fields:
              - name: photo
                label: Photo
                type: image
              - name: alt
                label: Describe the photo (for people who can't see it)
                type: string
              - name: caption
                label: Caption
                type: string
              - name: wide
                label: Wide photo (takes two columns)
                type: boolean
          - name: siblingPhoto
            label: Photo beside the note for brothers and sisters
            type: image
          - name: siblingPhotoAlt
            label: Describe that photo
            type: string
          - name: siblingCaption
            label: Caption under that photo
            type: string
      - name: get-involved-photo
        label: "Get Involved: photo under the heading"
        type: file
        path: src/data/get-involved.json
        format: json
        fields:
          - name: photo
            label: Photo
            type: image
          - name: photoAlt
            label: Describe the photo (for people who can't see it)
            type: string
          - name: caption
            label: Caption under the photo
            type: string
      - name: privacy
        label: Privacy policy
        type: file
        path: src/content/pages/privacy.md
        format: yaml-frontmatter
        fields: *pageFields
      - name: pennsylvania
        label: Water Safety in Pennsylvania
        type: file
        path: src/content/pages/pennsylvania.md
        format: yaml-frontmatter
        fields: *pageFields
      - name: water-safety-more
        label: "Water Safety: more ways to stay safe (teens, life jackets, recall, CPR)"
        type: file
        path: src/content/pages/water-safety-more.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Section heading
            type: string
          - name: eyebrow
            label: Small label above the heading
            type: string
          - name: lede
            label: Intro under the heading
            type: text
          - name: body
            label: Section text
            type: rich-text
            options:
              format: markdown
      - name: checklist
        label: Home water safety checklist (printable)
        type: file
        path: src/data/checklist.json
        format: json
        fields:
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro
            type: text
          - name: sections
            label: Checklist sections (one per layer)
            type: object
            list: true
            fields:
              - name: title
                label: Section title
                type: string
              - name: items
                label: Checklist items
                type: string
                list: true
          - name: sitterTitle
            label: Babysitter half-page title
            type: string
          - name: sitterIntro
            label: Babysitter half-page intro
            type: text
          - name: sitterItems
            label: Babysitter rules
            type: string
            list: true
          - name: sitterBlanks
            label: Blanks to fill in (address, phone numbers…)
            type: string
            list: true
      - name: flyer
        label: Printable flyer for pediatricians and daycares
        type: file
        path: src/data/flyer.json
        format: json
        fields:
          - name: title
            label: Big headline
            type: string
          - name: intro
            label: Intro under the headline
            type: text
          - name: facts
            label: Three facts (keep a source for each)
            type: object
            list: true
            fields:
              - name: stat
                label: Big number or word (e.g. "#1")
                type: string
              - name: label
                label: What it means
                type: string
              - name: source
                label: Source name (e.g. CDC)
                type: string
              - name: sourceUrl
                label: Source link
                type: string
          - name: layersTitle
            label: Layers heading
            type: string
          - name: layers
            label: Layers of protection (one line each)
            type: object
            list: true
            fields:
              - name: name
                label: Layer
                type: string
              - name: text
                label: What to do
                type: text
          - name: storyTitle
            label: Story heading
            type: string
          - name: story
            label: Adam's story (a few sentences)
            type: text
          - name: quote
            label: Quote
            type: text
          - name: quoteBy
            label: Who said it
            type: string
          - name: qrLabel
            label: Words next to the QR code
            type: text
          - name: cardTitle
            label: Handout card headline
            type: string
          - name: cardLead
            label: Handout card line above the list
            type: text
          - name: cardItems
            label: Handout card list
            type: string
            list: true
      - name: quiz
        label: Water safety quiz
        type: file
        path: src/data/quiz.json
        format: json
        fields:
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro
            type: text
          - name: questions
            label: Questions
            type: object
            list: true
            fields:
              - name: question
                label: Question
                type: text
              - name: choices
                label: Choices
                type: string
                list: true
              - name: answer
                label: Right answer (copy it exactly from the choices above)
                type: string
                description: If this doesn't match one of the choices word for word, the question is skipped so it can't mark every answer wrong.
              - name: explain
                label: Why (shown after they answer)
                type: text
              - name: source
                label: Source name (e.g. CDC)
                type: string
              - name: sourceUrl
                label: Source link
                type: string
          - name: certificateTitle
            label: Certificate title
            type: string
          - name: certificateText
            label: Certificate text (after the person's name)
            type: text
      - name: terms
        label: Terms of use
        type: file
        path: src/content/pages/terms.md
        format: yaml-frontmatter
        fields: *pageFields
      - name: accessibility
        label: Accessibility statement
        type: file
        path: src/content/pages/accessibility.md
        format: yaml-frontmatter
        fields: *pageFields
      - name: press
        label: Press & Media
        type: file
        path: src/content/pages/press.md
        format: yaml-frontmatter
        fields: *pageFields

  # ───────────────────────────── Events ─────────────────────────────
  - name: events
    label: 🎣 Events & fundraisers
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, kind]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: kind
        label: Type of event
        type: select
        options:
          values: [Fundraiser, Awareness, Swim & safety, Community]
      - name: date
        label: Date
        type: date
        default: ""
      - name: endDate
        label: Last day (only for events that run more than one day)
        type: date
        default: ""
        description: Leave empty for one-day events. For National Water Safety Month, the date is May 1 and the last day is May 31.
      - name: repeatsYearly
        label: Happens every year on this date
        type: boolean
        description: Yearly events (like Wear Blue on June 5) always show under "Coming up" with their next date.
      - name: when
        label: When, in words (e.g. "Every June", "Summer 2023", or a time like "1 to 5 p.m.")
        type: string
      - name: location
        label: Where
        type: string
      - name: summary
        label: One or two sentences about it
        type: text
      - name: highlight
        label: Big result (e.g. "$4,000 raised", "32 teams")
        type: string
      - name: photo
        label: Photo
        type: image
      - name: photoAlt
        label: Describe the photo (required if there's a photo)
        type: string
        description: For people who can't see it, e.g. "Teams playing cornhole under a big white tent".
      - name: photoWhole
        label: Show the whole picture (for flyers)
        type: boolean
        description: Turn on for flyers or wide pictures so nothing gets cut off.
      - name: link
        label: Link for sign-ups, tickets or photos (optional)
        type: string
      - name: linkLabel
        label: Button text for that link
        type: string
      - name: featured
        label: Show on the home page
        type: boolean
      - name: draft
        label: Hide this event (draft)
        type: boolean
      - name: body
        label: More about the event (optional)
        type: rich-text
        options:
          format: markdown

  # ───────────────────────────── News ─────────────────────────────
  - name: news
    label: 📰 News & updates
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: One-sentence summary
        type: text
      - name: draft
        label: Hide this post (draft)
        type: boolean
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  # ───────────────────────────── People & facts ─────────────────────────────
  - name: team
    label: 👨‍👩‍👧‍👦 Our team (About page)
    type: file
    path: src/data/team.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: bio
        label: One or two sentences
        type: text
      - name: photo
        label: Photo
        type: image
      - name: photoAlt
        label: Describe the photo (needed for every photo)
        type: string
        description: For people who can't see it, e.g. "Mom and Adam at the beach". The site won't go live while a photo has no description.

  - name: facts
    label: 📊 Statistics (every number needs a source)
    type: file
    path: src/data/facts.json
    format: json
    fields:
      - name: headline
        label: Home page numbers (one big one with the picture of children, plus three)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{stat}: {label}"
        fields:
          - name: stat
            label: Big number
            type: string
            description: For the big one, a plain number (like 7). The picture shows one child, then that many more.
          - name: label
            label: What it means
            type: text
            description: For the big one, write a full sentence with the number in it. For the others, start where the number leaves off (like "cause of death for children ages 1 to 4").
          - name: detail
            label: Extra detail (optional)
            type: text
          - name: feature
            label: Show this one big, with the picture of children
            type: boolean
          - name: picture
            label: Small picture (for the other three)
            type: select
            options:
              values: [none, ages, homes, fence]
            description: "ages: four children growing from age 1 to 4. homes: ten houses, with as many filled in as the number says (70% fills 7). fence: a yard where the house is the fourth side next to one fenced all the way around."
          - name: link
            label: Link (optional)
            type: string
            description: A page on our site, like /adams-story
          - name: linkText
            label: Link words (optional)
            type: string
          - name: source
            label: Source name
            type: string
          - name: sourceUrl
            label: Source link
            type: string
      - name: nonfatal
        label: Survivors page numbers
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{stat}: {label}"
        fields: &factFields
          - name: stat
            label: Big number
            type: string
          - name: label
            label: What it means
            type: text
          - name: detail
            label: Extra detail (optional)
            type: text
          - name: source
            label: Source name
            type: string
          - name: sourceUrl
            label: Source link
            type: string
      - name: risks
        label: High-risk moments (Water Safety page)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: body
            type: text
          - name: source
            type: string
          - name: sourceUrl
            type: string
          - name: source2
            label: Second source (optional)
            type: string
          - name: sourceUrl2
            label: Second source link
            type: string
      - name: groups
        label: The Facts page sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: intro
            type: text
          - name: facts
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{stat}: {label}"
            fields: *factFields

  - name: resources
    label: 🔗 Resource links
    type: file
    path: src/data/resources.json
    format: json
    fields:
      - name: survivor
        label: Help for survivor families
        type: object
