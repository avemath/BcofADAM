# The Studio: our website editor (Pages CMS, https://app.pagescms.org)
# This file tells the Studio what can be edited and how each box is labeled.
# Every save goes straight to the website. It's live in about 2 minutes.

media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Add {filename} ({userName})"
      update: "Update {filename} ({userName})"
      delete: "Remove {filename} ({userName})"
      rename: "Rename {oldFilename} to {newFilename} ({userName})"

content:
  # ───────────────────────────── Settings ─────────────────────────────
  - name: settings
    label: ⚙️ Site settings (donate link, Facebook, email)
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: donateUrl
        label: Donation link
        type: string
        description: Paste the full link to your donation page (Zeffy, Givebutter, etc.). The Donate buttons appear on the site as soon as this has a link. Leave it empty to hide every Donate button.
      - name: showFacebookFeed
        label: Show our Facebook feed on the website
        type: boolean
      - name: facebookUrl
        label: Facebook page link
        type: string
      - name: email
        label: Contact email
        type: string
      - name: contactFormAction
        label: Contact form link (optional)
        type: string
        description: From Web3Forms or Formspree. Leave empty to show the email address instead.
      - name: newsletterUrl
        label: Newsletter sign-up link (optional)
        type: string
      - name: instagramUrl
        label: Instagram link
        type: string
      - name: tiktokUrl
        label: TikTok link
        type: string
      - name: youtubeUrl
        label: YouTube link
        type: string
      - name: location
        label: Where we're based
        type: string
        description: Shown in the footer and used across the site (currently "Blair County, Pennsylvania").
      - name: taxExempt
        label: We're an IRS-approved 501(c)(3)
        type: boolean
        description: Shows "Because of ADAM is a 501(c)(3) nonprofit organization. EIN ..." in the footer and on the About and Donate pages.
      - name: ein
        label: EIN (tax ID number)
        type: string
        description: Replace {{TODO: EIN}} with our EIN, like 12-3456789. The site can't launch until this is filled in.
      - name: launchReady
        label: Launch the site (removes the "Preview" banner and lets Google find us)
        type: boolean
        description: The site won't publish with this on while any {{TODO}} or "Family, please review" box is left. If a save doesn't show up, check the Actions tab on GitHub for the list.
      - name: name
        label: Organization name
        type: string
      - name: tagline
        label: Full name (what ADAM stands for)
        type: string
        description: Allies in the Drowning Awareness Movement. Used in page titles, the footer, the About page and search results.
      - name: description
        label: Short description (used by Google and link previews)
        type: text

  # ───────────────────────────── Home page ─────────────────────────────
  - name: home
    label: 🏠 Home page
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: heroLede
        label: Intro under "Drowning is silent. We won't be."
        type: text
      - name: meetTitle
        label: "\"Meet Adam\" heading"
        type: string
      - name: teaser
        label: "\"Meet Adam\" paragraph"
        type: text
      - name: teaserMore
        label: Second paragraph
        type: text
      - name: photo
        label: Photo of Adam
        type: image
      - name: photoAlt
        label: Describe the photo (for people who can't see it)
        type: string
      - name: timeCompare
        label: Line under the clock
        type: string
      - name: familyQuote
        label: Big quote
        type: string
      - name: familyQuoteBy
        label: Who said it
        type: string
      - name: hopeTurn
        label: Hopeful line after the quote
        type: string

  # ───────────────────────────── Pages ─────────────────────────────
  - name: anywhere
    label: 🌙 Home page — Anywhere, anytime
    type: file
    path: src/data/anywhere.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        type: string
      - name: title
        label: Heading
        type: string
      - name: rotatePrefix
        label: Start of the moving line
        type: string
        description: For example "It can happen in"
      - name: rotateWords
        label: Words that flip by
        type: string
        list: true
        description: They flip by one at a time when someone scrolls to this part of the page. The last one stays on screen.
      - name: lede
        label: Intro
        type: text
      - name: places
        label: Places & times
        type: object
        list: true
        fields:
          - name: icon
            label: Icon (one emoji)
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: What to know
            type: text
          - name: tip
            label: What helps
            type: text
          - name: source
            label: Source (needed for any number)
            type: string
          - name: sourceUrl
            label: Source link
            type: string
          - name: link
            label: Link to another page (optional)
            type: string
            description: For example /swim-lessons
          - name: linkLabel
            label: Link text
            type: string
      - name: quote
        label: Quote at the bottom
        type: text
      - name: quoteBy
        label: Who said it
        type: string

  - name: pages
    label: 📄 Pages
    type: group
    items:
      - name: adams-story
        label: Adam's Story
        type: file
        path: src/content/pages/adams-story.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
          - name: eyebrow
            label: Small label above the title
            type: string
          - name: lede
            label: Intro under the title
            type: text
          - name: description
            label: Short description for Google
            type: text
          - name: body
            label: Page text
            type: rich-text
            options:
              format: markdown
      - name: swim-lessons
        label: ISR Swim Lessons
        type: file
        path: src/content/pages/swim-lessons.md
        format: yaml-frontmatter
        fields: &pageFields
          - name: title
            label: Page title
            type: string
          - name: eyebrow
            label: Small label above the title
            type: string
          - name: lede
            label: Intro under the title
            type: text
          - name: description
            label: Short description for Google
            type: text
          - name: body
            label: Page text
            type: rich-text
            options:
              format: markdown
      - name: isr-program
        label: ISR Swim Lessons — Dad's story box
        type: file
        path: src/data/isr.json
        format: json
        fields:
          - name: programName
            label: Program name
            type: string
          - name: blurb
            label: Short story
            type: text
          - name: disclosure
            label: Separation note (please keep this)
            type: text
            description: Keeps the nonprofit and Dad's swim lessons clearly separate. Please don't add sign-up links, prices or intake forms for Dad's lessons to the nonprofit site. Those belong on his own business page.
          - name: photo
            label: Photo
            type: image
          - name: photoAlt
            label: Describe the photo
            type: string
      - name: about-photo
        label: About Us — family photo
        type: file
        path: src/data/about.json
        format: json
        fields:
          - name: photo
            label: Photo (shows right under "It started with our little brother.")
            type: image
          - name: photoAlt
            label: Describe the photo (for people who can't see it)
            type: string
          - name: caption
            label: Caption under the photo
            type: string
      - name: privacy
        label: Privacy policy
        type: file
        path: src/content/pages/privacy.md
        format: yaml-frontmatter
        fields: *pageFields

  # ───────────────────────────── Events ─────────────────────────────
  - name: events
    label: 🎣 Events & fundraisers
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, kind]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: kind
        label: Type of event
        type: select
        options:
          values: [Fundraiser, Awareness, Swim & safety, Community]
      - name: date
        label: Date (leave empty if it's a yearly event with no set date)
        type: date
        default: ""
      - name: when
        label: When, in words (e.g. "Every June", "Summer 2023")
        type: string
      - name: location
        label: Where
        type: string
      - name: summary
        label: One or two sentences about it
        type: text
      - name: highlight
        label: Big result (e.g. "$4,000 raised", "32 teams")
        type: string
      - name: photo
        label: Photo
        type: image
      - name: link
        label: Link for sign-ups, tickets or photos (optional)
        type: string
      - name: linkLabel
        label: Button text for that link
        type: string
      - name: featured
        label: Show on the home page
        type: boolean
      - name: draft
        label: Hide this event (draft)
        type: boolean
      - name: body
        label: More about the event (optional)
        type: rich-text
        options:
          format: markdown

  # ───────────────────────────── News ─────────────────────────────
  - name: news
    label: 📰 News & updates
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: summary
        label: One-sentence summary
        type: text
      - name: draft
        label: Hide this post (draft)
        type: boolean
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  # ───────────────────────────── People & facts ─────────────────────────────
  - name: team
    label: 👨‍👩‍👧‍👦 Our team (About page)
    type: file
    path: src/data/team.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: bio
        label: One or two sentences
        type: text
      - name: photo
        label: Photo
        type: image

  - name: facts
    label: 📊 Statistics (every number needs a source)
    type: file
    path: src/data/facts.json
    format: json
    fields:
      - name: headline
        label: Home page numbers (keep 4)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{stat} — {label}"
        fields: &factFields
          - name: stat
            label: Big number
            type: string
          - name: label
            label: What it means
            type: text
          - name: detail
            label: Extra detail (optional)
            type: text
          - name: source
            label: Source name
            type: string
          - name: sourceUrl
            label: Source link
            type: string
      - name: nonfatal
        label: Survivors page numbers
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{stat} — {label}"
        fields: *factFields
      - name: risks
        label: High-risk moments (Water Safety page)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: body
            type: text
          - name: source
            type: string
          - name: sourceUrl
            type: string
      - name: groups
        label: The Facts page sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: intro
            type: text
          - name: facts
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{stat} — {label}"
            fields: *factFields

  - name: resources
    label: 🔗 Resource links
    type: file
    path: src/data/resources.json
    format: json
    fields:
      - name: survivor
        label: Help for survivor families
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields: &resourceFields
          - name: name
            type: string
          - name: url
            label: Link
            type: string
          - name: description
            type: text
      - name: groups
        label: Resource sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: items
            label: Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields: *resourceFields
